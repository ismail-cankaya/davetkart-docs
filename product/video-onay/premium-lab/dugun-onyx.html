<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Onyx &amp; Sıvı Altın — Düğün Davetiyesi (Premium Konsept 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300;400&display=swap" rel="stylesheet" />
<style>
/* ============================================================================
   TASARIM DİLİ — "Onyx & Sıvı Altın"
   Koyu tema, açık temanın koyulaştırılmış hâli değildir. Üç kural:
   1) Altın DOLGU değil HAT'tır. Geniş altın alanlar ucuzlar; 1px'lik altın
      çizgi kuyumcu işi gibi durur.
   2) Işık tek yönlüdür. Her yüzey aynı sanal ışıktan parlarsa sahne yassılaşır.
   3) Siyah asla #000 değildir. Saf siyah OLED'de "delik" gibi görünür;
      #07070a gibi hafif mavi-siyah derinlik verir.
   ========================================================================= */
:root{
  --onyx:#07070a;
  --ink:#f4ece0;
  --ink-soft:rgba(244,236,224,.62);
  --gold-1:#f7e2b0;
  --gold-2:#d5ab5c;
  --gold-3:#8d6a2a;
  --rose:#e0b8a4;

  --hair:rgba(226,193,128,.55);
  --glass:linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  --ease-luxe:cubic-bezier(.22,1,.36,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Jost",-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--onyx);color:var(--ink);font-family:var(--sans);overflow-x:hidden}

.stage{position:relative;width:100%;height:100dvh;min-height:600px;overflow:hidden;isolation:isolate}
.layer{position:absolute;inset:-3%;will-change:transform}

/* --- video zemini --- */
#bg{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 1.4s var(--ease-soft)}
#bg.ready{opacity:1}
#poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tone{position:absolute;inset:0;background:
  radial-gradient(78% 62% at 50% 50%,rgba(7,7,10,.82),rgba(7,7,10,.30) 55%,transparent 78%),
  linear-gradient(180deg,rgba(7,7,10,.55),transparent 30%,rgba(7,7,10,.72));}

/* imleci takip eden ışık: onyx yüzeyde altın dokuyu "aydınlatır" */
#spot{position:absolute;inset:0;pointer-events:none;mix-blend-mode:plus-lighter;
  background:radial-gradient(220px 220px at var(--mx,50%) var(--my,50%),
             rgba(213,171,92,.20),rgba(213,171,92,.06) 45%,transparent 70%);
  opacity:0;transition:opacity .6s var(--ease-soft)}
#spot.on{opacity:1}

#dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ============================================================================
   ART DECO ÇERÇEVE — kendini çizer
   ========================================================================= */
.frame{position:absolute;inset:clamp(14px,2.4vw,34px);pointer-events:none}
.frame svg{width:100%;height:100%;overflow:visible}
.frame path,.frame line{fill:none;stroke:var(--hair);stroke-width:1;vector-effect:non-scaling-stroke}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  animation:draw 2.2s var(--ease-luxe) .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ============================================================================
   İÇERİK
   ========================================================================= */
.content{position:absolute;inset:0;display:grid;place-items:center;
         padding:clamp(30px,6vw,72px);z-index:4;text-align:center}
.panel{position:relative;width:min(640px,100%);padding:clamp(28px,4vw,52px) clamp(22px,4vw,54px);
  border-radius:4px;background:var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(130%);backdrop-filter:blur(14px) saturate(130%);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 50px 110px -40px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.16);
  opacity:0;transform:translateY(20px);transition:opacity 1.2s var(--ease-luxe),transform 1.2s var(--ease-luxe)}
.panel.in{opacity:1;transform:none}
/* tek seferlik ışık süpürmesi: cam yüzeyin "kurulduğu" an */
.panel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);
  transform:translateX(-120%)}
.panel.in::after{animation:shine 1.8s var(--ease-soft) .9s}
@keyframes shine{to{transform:translateX(120%)}}

/* --- monogram --- */
.mono{position:relative;width:104px;height:104px;margin:0 auto 22px;
  opacity:0;transform:scale(.86)}
.in .mono{opacity:1;transform:none;transition:opacity 1s var(--ease-luxe) .35s,transform 1s var(--ease-luxe) .35s}
.mono svg{position:absolute;inset:0;width:100%;height:100%}
.mono .spin{animation:spin 44s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.mono b{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--serif);font-weight:300;font-size:34px;letter-spacing:.02em;
  background:linear-gradient(120deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
  -webkit-background-clip:text;background-clip:text;color:transparent}

.kicker{font-size:clamp(9px,.95vw,11px);letter-spacing:.52em;text-transform:uppercase;
        color:var(--ink-soft);font-weight:300}
.names{font-family:var(--serif);font-weight:300;line-height:1.04;margin:.20em 0 .10em;
  font-size:clamp(44px,7vw,84px);
  /* altın degradenin metne kırpılması + çok yavaş kayması: dökme metal hissi */
  background:linear-gradient(100deg,var(--gold-3),var(--gold-1) 28%,var(--gold-2) 52%,var(--gold-1) 76%,var(--gold-3));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:flow 14s linear infinite}
@keyframes flow{to{background-position:220% 0}}
.amp{font-style:italic;opacity:.9;margin:0 .12em}

/* "glow in": harf aralığı geniş başlar, ışıkla birlikte yerine oturur */
.glow{opacity:0;filter:blur(14px);letter-spacing:.42em;transform:translateY(.18em)}
.in .glow{animation:glowin 1.5s var(--ease-luxe) forwards}
@keyframes glowin{
  60%{opacity:1;filter:blur(0)}
  to{opacity:1;filter:blur(0);letter-spacing:normal;transform:none}
}

.meta{display:flex;align-items:center;justify-content:center;gap:16px;margin:20px 0 4px;
  font-size:clamp(10px,1vw,12px);letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft)}
.meta i{display:block;width:34px;height:1px;background:var(--hair);font-style:normal}

/* --- geri sayım: kutu yok, ince ayraçlar --- */
.count{display:flex;justify-content:center;gap:clamp(14px,3vw,34px);margin:30px 0 32px}
.unit{position:relative;min-width:56px}
.unit+.unit::before{content:"";position:absolute;left:calc(-1 * clamp(7px,1.5vw,17px));top:14%;
  width:1px;height:56%;background:linear-gradient(transparent,var(--hair),transparent)}
.unit b{display:block;font-family:var(--serif);font-weight:300;font-size:clamp(26px,3.2vw,40px);
  line-height:1;font-variant-numeric:tabular-nums;color:var(--gold-1)}
.unit i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--ink-soft);margin-top:9px}

/* --- butonlar --- */
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;cursor:pointer;background:transparent;
  border:1px solid rgba(226,193,128,.45);color:var(--gold-1);
  font-family:var(--sans);font-weight:300;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;
  padding:15px 30px;border-radius:2px;transition:color .5s var(--ease-luxe),border-color .5s var(--ease-luxe)}
/* dolgu aşağıdan yükselir: altın "dökülüyor" gibi */
.btn::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(160deg,var(--gold-1),var(--gold-2));
  transform:translateY(101%);transition:transform .55s var(--ease-luxe)}
.btn>span{position:relative;z-index:1}
.btn:hover{color:#1a1206;border-color:var(--gold-1)}
.btn:hover::before{transform:none}
.btn-quiet{border-color:rgba(255,255,255,.18);color:var(--ink)}
.btn-quiet::before{background:rgba(255,255,255,.92)}
.btn-quiet:hover{color:#14121a}
.ripple{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);
  background:rgba(255,255,255,.35);pointer-events:none;animation:ripple .7s var(--ease-soft) forwards}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

.cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:4;
  display:flex;flex-direction:column;align-items:center;gap:9px;
  font-size:8.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);
  opacity:0;transition:opacity 1s var(--ease-soft) 3s}
.cue.in{opacity:1}
.cue span{width:1px;height:40px;background:linear-gradient(var(--gold-2),transparent);
  animation:drop 2.6s var(--ease-soft) infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}
                65%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

@media (max-aspect-ratio:1/1){
  .count{gap:clamp(10px,4vw,20px)}
  .unit{min-width:44px}
  .panel{padding:34px 20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .panel,.mono{opacity:1;transform:none}
  .glow{opacity:1;filter:none;letter-spacing:normal;transform:none}
  .draw{stroke-dashoffset:0}
  #dust,#spot{display:none}
}
</style>
</head>
<body>

<section class="stage" id="stage">

  <div class="layer" data-depth="0.008" style="inset:-1.5%">
    <img id="poster" alt="" src="../../../davetkart-frontent/public/videos/templates/dugun-onyx/dugun-onyx-desktop-poster.jpg" />
    <video id="bg" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1"></video>
    <div class="tone"></div>
    <div id="spot"></div>
  </div>

  <canvas id="dust"></canvas>

  <!-- art deco çerçeve: köşeleri kırık ince altın hat -->
  <div class="layer" data-depth="0.022">
    <div class="frame">
      <svg preserveAspectRatio="none" viewBox="0 0 100 100">
        <path class="draw" style="--len:420"
              d="M6 0.6 H94 L99.4 6 V94 L94 99.4 H6 L0.6 94 V6 Z" />
      </svg>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0">
        <path class="draw" style="--len:60;animation-delay:1.1s" d="M0.6 14 H6 V6 H14" />
        <path class="draw" style="--len:60;animation-delay:1.1s" d="M99.4 14 H94 V6 H86" />
        <path class="draw" style="--len:60;animation-delay:1.1s" d="M0.6 86 H6 V94 H14" />
        <path class="draw" style="--len:60;animation-delay:1.1s" d="M99.4 86 H94 V94 H86" />
      </svg>
    </div>
  </div>

  <div class="content">
    <article class="panel" id="panel">

      <div class="mono">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" fill="none" stroke="var(--hair)" stroke-width="1"/>
          <circle class="spin" cx="50" cy="50" r="40" fill="none" stroke="rgba(226,193,128,.42)"
                  stroke-width="1" stroke-dasharray="2 7" stroke-linecap="round"/>
        </svg>
        <b>E&nbsp;M</b>
      </div>

      <div class="kicker glow" style="animation-delay:.55s">Düğün Davetiyemize</div>

      <h1 class="names">
        <span class="glow" style="animation-delay:.72s">Elif</span><span class="amp glow" style="animation-delay:.86s">&amp;</span><span class="glow" style="animation-delay:1s">Mert</span>
      </h1>

      <div class="meta glow" style="animation-delay:1.2s">
        <i></i>12 Eylül 2026 · Cumartesi<i></i>
      </div>

      <div class="count" id="count">
        <div class="unit"><b data-k="d">00</b><i>Gün</i></div>
        <div class="unit"><b data-k="h">00</b><i>Saat</i></div>
        <div class="unit"><b data-k="m">00</b><i>Dakika</i></div>
        <div class="unit"><b data-k="s">00</b><i>Saniye</i></div>
      </div>

      <div class="actions">
        <button class="btn"><span>Katılıyorum</span></button>
        <button class="btn btn-quiet"><span>Konum &amp; Detaylar</span></button>
      </div>
    </article>
  </div>

  <div class="cue" id="cue">Kaydırın<span></span></div>
</section>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage');

  /* --- A. konteyner oranına göre kaynak seçimi (React VideoBackdrop sözleşmesi) --- */
  const DIR = '../../../davetkart-frontent/public/videos/templates/dugun-onyx/';
  const video = document.getElementById('bg');
  const poster = document.getElementById('poster');
  let variant = null;

  function setVariant(next){
    if (next === variant) return;
    variant = next;
    poster.src = `${DIR}dugun-onyx-${next}-poster.jpg`;
    video.classList.remove('ready');
    video.innerHTML = '';
    for (const [ext, type] of [['mp4','video/mp4'],['webm','video/webm']]){
      const s = document.createElement('source');
      s.src = `${DIR}dugun-onyx-${next}.${ext}`; s.type = type;
      video.appendChild(s);
    }
    video.load();
  }
  video.addEventListener('canplay', () => video.classList.add('ready'));

  const measure = () => {
    const r = stage.getBoundingClientRect();
    const ratio = r.width / Math.max(1, r.height);
    if (variant === null) setVariant(ratio < 1 ? 'mobile' : 'desktop');
    else if (variant === 'desktop' && ratio < .95) setVariant('mobile');
    else if (variant === 'mobile' && ratio > 1.05) setVariant('desktop');
  };
  measure();
  new ResizeObserver(measure).observe(stage);
  new IntersectionObserver(([e]) => {
    e.isIntersecting ? video.play().catch(() => {}) : video.pause();
  }, { threshold: .01 }).observe(stage);

  /* --- B. imleç ışığı + parallax --- */
  const spot = document.getElementById('spot');
  const layers = [...document.querySelectorAll('.layer')].map((el) => ({
    el, depth: parseFloat(el.dataset.depth), x: 0, y: 0
  }));
  let tx = 0, ty = 0, mx = -999, my = -999;

  if (!reduced){
    addEventListener('pointermove', (e) => {
      mx = e.clientX; my = e.clientY;
      tx = (e.clientX / innerWidth - .5) * 2;
      ty = (e.clientY / innerHeight - .5) * 2;
      spot.style.setProperty('--mx', e.clientX + 'px');
      spot.style.setProperty('--my', e.clientY + 'px');
      spot.classList.add('on');
    }, { passive: true });
    addEventListener('pointerleave', () => spot.classList.remove('on'));
    addEventListener('deviceorientation', (e) => {
      if (e.gamma == null) return;
      tx = Math.max(-1, Math.min(1, e.gamma / 34));
      ty = Math.max(-1, Math.min(1, ((e.beta ?? 45) - 45) / 34));
    }, { passive: true });
  }

  /* --- C. altın toz: sahilden daha az, daha yavaş, daha küçük ---
     Koyu sahnede parçacık çok çabuk "kar yağışı"na döner. Lüks his
     yoğunluktan değil seyreklikten gelir. */
  const canvas = document.getElementById('dust');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dots = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const spawn = (anywhere) => ({
    x: rnd(0, W), y: anywhere ? rnd(0, H) : rnd(H, H + 40),
    r: rnd(.5, 1.7), a: rnd(.10, .55),
    vy: rnd(-.10, -.30), vx: rnd(-.07, .07),
    tw: rnd(0, 6.28), ts: rnd(.006, .020)
  });

  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dots = Array.from({ length: Math.round(Math.min(70, Math.max(24, W * H / 26000))) },
                      () => spawn(true));
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    for (const d of dots){
      d.x += d.vx; d.y += d.vy; d.tw += d.ts;
      const dx = d.x - mx, dy = d.y - my, dist = Math.hypot(dx, dy);
      if (dist < 110){
        const f = (1 - dist / 110) * .7;
        d.x += (dx / (dist || 1)) * f; d.y += (dy / (dist || 1)) * f;
      }
      if (d.y < -20 || d.x < -30 || d.x > W + 30) Object.assign(d, spawn(false));
      const tw = .5 + .5 * Math.sin(d.tw);
      const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r * 6);
      g.addColorStop(0, `rgba(247,226,176,${d.a * tw})`);
      g.addColorStop(.45, `rgba(213,171,92,${d.a * tw * .3})`);
      g.addColorStop(1, 'rgba(213,171,92,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 6, 0, 6.28); ctx.fill();
    }
  }

  function tick(){
    for (const l of layers){
      l.x += (tx * l.depth * 100 - l.x) * .07;
      l.y += (ty * l.depth * 100 - l.y) * .07;
      l.el.style.transform = `translate3d(${l.x}px,${l.y}px,0)`;
    }
    draw();
    requestAnimationFrame(tick);
  }
  if (!reduced){ resize(); addEventListener('resize', resize); requestAnimationFrame(tick); }

  /* --- D. geri sayım --- */
  const TARGET = new Date('2026-09-12T18:00:00+03:00').getTime();
  const cells = {};
  document.querySelectorAll('#count b').forEach((b) => cells[b.dataset.k] = b);
  const pad = (v) => String(Math.max(0, v)).padStart(2, '0');
  setInterval(() => {
    const diff = Math.max(0, TARGET - Date.now());
    const n = { d: Math.floor(diff / 864e5), h: Math.floor(diff / 36e5) % 24,
                m: Math.floor(diff / 6e4) % 60, s: Math.floor(diff / 1e3) % 60 };
    for (const k in cells) if (cells[k].textContent !== pad(n[k])) cells[k].textContent = pad(n[k]);
  }, 250);

  /* --- E. mikro etkileşim: tıklama dalgası --- */
  document.querySelectorAll('.btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      const r = btn.getBoundingClientRect();
      const el = document.createElement('span');
      el.className = 'ripple';
      const size = Math.max(r.width, r.height) * 2.2;
      el.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left}px;top:${e.clientY - r.top}px`;
      btn.appendChild(el);
      setTimeout(() => el.remove(), 750);
    });
  });

  /* --- F. açılış: sahne kurulduktan sonra içerik girer --- */
  const start = () => {
    document.getElementById('panel').classList.add('in');
    setTimeout(() => document.getElementById('cue').classList.add('in'), 500);
  };
  video.addEventListener('canplay', start, { once: true });
  setTimeout(start, 1500);
})();
</script>
</body>
</html>
