<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Deniz Kıyısı — Düğün Davetiyesi (Premium Konsept 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
/* ============================================================================
   0. TASARIM JETONLARI (design tokens)
   Renkler doğrudan videonun paletinden örneklendi; UI ile arka plan aynı
   ışıktan beslenince kompozisyon "yapıştırılmış" değil "çekilmiş" hissi verir.
   ========================================================================= */
:root{
  --ink:#fff6e9;
  --ink-soft:rgba(255,246,233,.74);
  --gold:#f6d59a;
  --gold-deep:#c9a24d;
  --coral:#e08a5c;
  --night:#191627;

  --glass-bg:linear-gradient(158deg,rgba(255,255,255,.14),rgba(255,255,255,.045));
  --glass-line:rgba(255,255,255,.24);
  --glass-shadow:0 40px 90px -30px rgba(10,6,20,.75);

  --ease-luxe:cubic-bezier(.22,1,.36,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);

  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost",-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--sans);overflow-x:hidden}

/* ============================================================================
   1. SAHNE VE KATMANLAR
   z-index sırası bilinçli: video(0) < atmosfer(1) < silüet(2) < toz(3) < UI(4).
   Her katman kendi derinliğinde parallax alır; tek bir katmanda toplanan
   sahne düz görünür, ayrıştırılan sahne derinlik kazanır.
   ========================================================================= */
.stage{position:relative;width:100%;height:100dvh;min-height:560px;overflow:hidden;isolation:isolate}
.layer{position:absolute;inset:-4% -4%;will-change:transform}

/* --- 1.0 video --- */
#bg{width:100%;height:100%;object-fit:cover;display:block;opacity:0;
    transition:opacity 1.2s var(--ease-soft)}
#bg.ready{opacity:1}
#poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tone{position:absolute;inset:0;
  background:
    radial-gradient(120% 80% at 50% 62%,rgba(255,214,138,.16),transparent 60%),
    linear-gradient(180deg,rgba(12,8,24,.55),rgba(12,8,24,.05) 38%,rgba(12,8,24,.62));}
/* Sinematik grade: üstte ve altta koyulaştırma, merkezde sıcak ışık.
   Metnin kontrastını videoyu karartmadan yükseltir. */

/* --- 1.1 atmosfer: martılar --- */
.gull{position:absolute;fill:none;stroke:rgba(28,18,32,.72);stroke-width:2.4;
      stroke-linecap:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.gull-wrap{position:absolute;animation:glide linear infinite}
.gull-wrap.g1{top:22%;animation-duration:34s}
.gull-wrap.g2{top:29%;animation-duration:46s;animation-delay:-12s;transform:scale(.72)}
.gull-wrap.g3{top:17%;animation-duration:58s;animation-delay:-30s;transform:scale(.52)}
.gull-wrap svg{animation:flap 1.9s var(--ease-soft) infinite}
.gull-wrap.g2 svg{animation-duration:2.4s}
.gull-wrap.g3 svg{animation-duration:3.1s}
@keyframes glide{
  from{transform:translate3d(-14vw,0,0)}
  to  {transform:translate3d(114vw,-6vh,0)}
}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.34)}}

/* --- 1.2 silüet: salıncak --- */
.silhouette{position:absolute;right:4%;top:0;height:86%;width:auto;
  filter:drop-shadow(0 26px 40px rgba(20,10,30,.45))}
.swing-pivot{transform-box:fill-box;transform-origin:50% 0;
  animation:sway 6.4s var(--ease-soft) infinite}
@keyframes sway{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}

/* --- 1.3 altın ışık tozu (canvas) --- */
#dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ============================================================================
   2. İÇERİK — cam katman (glassmorphism)
   ========================================================================= */
.content{position:absolute;inset:0;display:flex;align-items:center;
         padding:clamp(20px,5vw,72px);z-index:4}
.card{
  position:relative;width:min(560px,100%);padding:clamp(26px,3.4vw,44px);
  border-radius:28px;background:var(--glass-bg);border:1px solid var(--glass-line);
  box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.35);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  backdrop-filter:blur(20px) saturate(150%);
  opacity:0;transform:translateY(28px) scale(.985);
}
.card.in{opacity:1;transform:none;transition:opacity 1.1s var(--ease-luxe),transform 1.1s var(--ease-luxe)}
/* Camın üst kenarındaki ışık çizgisi: gerçek camda kenar ışığı kırar.
   Bu 1px'lik detay "premium" hissinin büyük kısmını taşır. */
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(150deg,rgba(255,255,255,.55),rgba(255,255,255,0) 38%,rgba(246,213,154,.35));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

.kicker{font-family:var(--sans);font-weight:400;font-size:clamp(10px,1vw,12px);
        letter-spacing:.46em;text-transform:uppercase;color:var(--gold)}
.names{font-family:var(--serif);font-weight:300;line-height:1.02;
       font-size:clamp(46px,7.2vw,86px);margin:.18em 0 .06em}
.amp{display:inline-block;font-style:italic;color:var(--gold);
     font-size:.62em;vertical-align:.14em;margin:0 .14em}
.tagline{font-family:var(--serif);font-style:italic;font-size:clamp(15px,1.6vw,20px);
         color:var(--ink-soft);margin:0 0 22px}
.rule{width:64px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:18px 0}

/* metin girişi: alttan yükselerek + bulanıklığı çözülerek */
.reveal{overflow:hidden;display:block}
.reveal>span{display:inline-block;opacity:0;filter:blur(10px);
  transform:translateY(.9em) rotate(1.2deg)}
.in .reveal>span{animation:rise 1.05s var(--ease-luxe) forwards}
@keyframes rise{to{opacity:1;filter:blur(0);transform:none}}

/* --- geri sayım --- */
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px 0 28px}
.tile{position:relative;padding:12px 6px;border-radius:16px;text-align:center;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:hidden}
.tile b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(22px,2.6vw,32px);
        line-height:1;font-variant-numeric:tabular-nums}
.tile i{display:block;font-style:normal;font-size:9px;letter-spacing:.22em;text-transform:uppercase;
        color:var(--ink-soft);margin-top:7px}
/* saniye değişince karo çok kısa bir ışık alır: sayaç "canlı" hisseder */
.tile.pulse::after{content:"";position:absolute;inset:0;background:rgba(246,213,154,.18);
  animation:pulse .6s var(--ease-soft) forwards}
@keyframes pulse{to{opacity:0}}

/* --- butonlar --- */
.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:15px 26px;border-radius:999px;transition:transform .35s var(--ease-luxe),box-shadow .35s var(--ease-luxe)}
.btn-gold{color:#241704;background:linear-gradient(135deg,#fbe3b4,var(--gold) 45%,var(--gold-deep));
  box-shadow:0 14px 34px -12px rgba(201,162,77,.85)}
.btn-ghost{color:var(--ink);background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.24);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn:hover{transform:translateY(-2px)}
.btn-gold:hover{box-shadow:0 20px 44px -12px rgba(201,162,77,.95)}
/* parlama süpürmesi: sadece hover'da, sonsuz döngü değil - dikkat çalmaz */
.btn-gold::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
  transform:skewX(-18deg);opacity:0}
.btn-gold:hover::after{animation:sweep .9s var(--ease-soft)}
@keyframes sweep{from{left:-60%;opacity:1}to{left:120%;opacity:0}}
/* tıklama dalgası */
.ripple{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);
  background:rgba(255,255,255,.45);pointer-events:none;animation:ripple .65s var(--ease-soft) forwards}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* --- kaydırma ipucu --- */
.cue{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:4;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);
  opacity:0;transition:opacity 1s var(--ease-soft) 2.6s}
.cue.in{opacity:1}
.cue span{width:1px;height:38px;background:linear-gradient(var(--gold),transparent);
  animation:drop 2.4s var(--ease-soft) infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}
                40%{transform:scaleY(1);transform-origin:top}
                60%{transform:scaleY(1);transform-origin:bottom}
                100%{transform:scaleY(0);transform-origin:bottom}}

/* --- mobil --- */
@media (max-aspect-ratio:1/1){
  .content{align-items:flex-start;padding-top:9vh}
  .card{width:100%}
  .silhouette{right:-6%;height:52%;top:auto;bottom:6%}
  .gull-wrap.g1{top:14%}.gull-wrap.g2{top:19%}.gull-wrap.g3{top:10%}
}

/* --- erişilebilirlik: hareket azaltma --- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .card{opacity:1;transform:none}
  .reveal>span{opacity:1;filter:none;transform:none}
  #dust{display:none}
}
</style>
</head>
<body>

<section class="stage" id="stage">

  <!-- 0 · sinematik zemin -->
  <div class="layer" data-depth="0.010" style="inset:-2%">
    <img id="poster" alt="" src="../../../davetkart-frontent/public/videos/templates/dugun-sahil/dugun-sahil-desktop-poster.jpg" />
    <video id="bg" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1"></video>
    <div class="tone"></div>
  </div>

  <!-- 1 · atmosfer: martılar -->
  <div class="layer" data-depth="0.030">
    <div class="gull-wrap g1"><svg width="46" height="16" viewBox="0 0 46 16"><path class="gull" d="M2 12C8 3 12 2 16 9c3-6 8-7 12 0 4-7 9-6 12 1"/></svg></div>
    <div class="gull-wrap g2"><svg width="46" height="16" viewBox="0 0 46 16"><path class="gull" d="M2 12C8 3 12 2 16 9c3-6 8-7 12 0 4-7 9-6 12 1"/></svg></div>
    <div class="gull-wrap g3"><svg width="46" height="16" viewBox="0 0 46 16"><path class="gull" d="M2 12C8 3 12 2 16 9c3-6 8-7 12 0 4-7 9-6 12 1"/></svg></div>
  </div>

  <!-- 2 · silüet: çiçekli salıncakta çift -->
  <div class="layer" data-depth="0.055">
    <svg class="silhouette" viewBox="0 0 300 460" aria-hidden="true">
      <g fill="#160d1c">
        <!-- dal -->
        <path d="M0 26c46 6 92 2 138 12 34 7 68 20 100 38 12 7 22 15 32 24-14-6-27-13-41-18-30-11-61-18-93-22-45-6-91-4-136-13Z"/>
        <path d="M96 34c14-9 30-14 46-16-12 8-25 13-38 18Zm74 12c16-6 33-8 50-6-16 5-33 7-50 6Z" opacity=".85"/>
      </g>
      <g class="swing-pivot">
        <!-- halatlar -->
        <path d="M104 40h5v250h-5Zm86 6h5v244h-5Z" fill="#160d1c"/>
        <!-- oturak -->
        <rect x="86" y="288" width="124" height="12" rx="5" fill="#160d1c"/>
        <!-- çift silüeti: gelin (solda, uçuşan etek) + damat -->
        <g fill="#160d1c">
          <circle cx="126" cy="196" r="17"/>
          <path d="M126 213c14 0 24 12 26 27l6 46c-24 8-44 8-64 0l6-46c2-15 12-27 26-27Z"/>
          <path d="M100 286c8-14 20-22 34-22s28 9 34 24c-6 8-20 12-34 12s-28-5-34-14Z"/>
          <circle cx="172" cy="188" r="18"/>
          <path d="M172 206c16 0 27 13 29 30l5 52h-68l5-52c2-17 13-30 29-30Z"/>
          <!-- gelinin başı damadın omzuna yaslı -->
          <path d="M143 190c6-6 14-9 22-8-6 5-14 8-22 8Z"/>
        </g>
        <!-- beyaz gül ve orkideler: halatlara sarmaşık -->
        <g fill="#241528" opacity=".95">
          <circle cx="106" cy="70" r="9"/><circle cx="118" cy="84" r="6"/><circle cx="98" cy="92" r="7"/>
          <circle cx="112" cy="112" r="5"/><circle cx="102" cy="132" r="6"/>
          <circle cx="192" cy="74" r="8"/><circle cx="182" cy="90" r="6"/><circle cx="198" cy="102" r="6"/>
          <circle cx="188" cy="124" r="5"/>
          <circle cx="96" cy="292" r="10"/><circle cx="110" cy="300" r="7"/>
          <circle cx="200" cy="294" r="9"/><circle cx="186" cy="302" r="6"/>
        </g>
      </g>
    </svg>
  </div>

  <!-- 3 · altın ışık tozu -->
  <canvas id="dust"></canvas>

  <!-- 4 · içerik -->
  <div class="content">
    <article class="card" id="card">
      <div class="kicker reveal"><span style="animation-delay:.15s">Düğün Davetiyemize</span></div>

      <h1 class="names reveal">
        <span style="animation-delay:.30s">Elif</span><span class="amp" style="animation-delay:.42s">&amp;</span><span style="animation-delay:.54s">Mert</span>
      </h1>

      <div class="rule"></div>

      <p class="tagline reveal">
        <span style="animation-delay:.68s">Deniz kıyısında, gün batarken… en güzel günümüzde yanımızda olun.</span>
      </p>

      <div class="count" id="count">
        <div class="tile"><b data-k="d">00</b><i>Gün</i></div>
        <div class="tile"><b data-k="h">00</b><i>Saat</i></div>
        <div class="tile"><b data-k="m">00</b><i>Dakika</i></div>
        <div class="tile"><b data-k="s">00</b><i>Saniye</i></div>
      </div>

      <div class="actions">
        <button class="btn btn-gold">Katılıyorum</button>
        <button class="btn btn-ghost">Konum &amp; Detaylar</button>
      </div>
    </article>
  </div>

  <div class="cue" id="cue">Kaydırın<span></span></div>
</section>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage');

  /* ==========================================================================
     A. VİDEO KAYNAK SEÇİMİ
     Karar viewport'a değil KONTEYNERİN oranına bakar (React'teki VideoBackdrop
     ile aynı sözleşme): editör içindeki telefon simülatöründe de doğru çalışır.
     Histerezis (0.95/1.05) sınırda sürekli yeniden yüklemeyi engeller.
     ========================================================================= */
  const DIR = '../../../davetkart-frontent/public/videos/templates/dugun-sahil/';
  const video = document.getElementById('bg');
  const poster = document.getElementById('poster');
  let variant = null;

  function setVariant(next){
    if (next === variant) return;
    variant = next;
    poster.src = `${DIR}dugun-sahil-${next}-poster.jpg`;
    video.classList.remove('ready');
    video.innerHTML = '';
    // mp4 önce: H.264 her cihazda donanımda çözülür (pil/ısı), VP9 iPhone'da çözülmez.
    for (const [ext, type] of [['mp4','video/mp4'],['webm','video/webm']]){
      const s = document.createElement('source');
      s.src = `${DIR}dugun-sahil-${next}.${ext}`; s.type = type;
      video.appendChild(s);
    }
    video.load();
  }
  video.addEventListener('canplay', () => video.classList.add('ready'));

  const measure = () => {
    const r = stage.getBoundingClientRect();
    const ratio = r.width / Math.max(1, r.height);
    if (variant === null) setVariant(ratio < 1 ? 'mobile' : 'desktop');
    else if (variant === 'desktop' && ratio < 0.95) setVariant('mobile');
    else if (variant === 'mobile' && ratio > 1.05) setVariant('desktop');
  };
  measure();
  new ResizeObserver(measure).observe(stage);

  // Ekran dışındayken duraklat: boşuna GPU ve pil harcanmasın.
  new IntersectionObserver(([e]) => {
    e.isIntersecting ? video.play().catch(() => {}) : video.pause();
  }, { threshold: 0.01 }).observe(stage);

  /* ==========================================================================
     B. PARALLAX — katmanlar farklı derinlikte
     Ham mouse değeri doğrudan uygulanmaz; her karede hedefe %8 yaklaşılır
     (lerp). Bu "ağırlık" hissi verir, sinirli titremeyi yok eder.
     ========================================================================= */
  const layers = [...document.querySelectorAll('.layer')].map((el) => ({
    el, depth: parseFloat(el.dataset.depth), x: 0, y: 0
  }));
  let tx = 0, ty = 0;

  if (!reduced){
    addEventListener('pointermove', (e) => {
      tx = (e.clientX / innerWidth - .5) * 2;
      ty = (e.clientY / innerHeight - .5) * 2;
    }, { passive: true });

    // Mobilde jiroskop: telefonu eğince sahne kayar.
    addEventListener('deviceorientation', (e) => {
      if (e.gamma == null) return;
      tx = Math.max(-1, Math.min(1, e.gamma / 34));
      ty = Math.max(-1, Math.min(1, ((e.beta ?? 45) - 45) / 34));
    }, { passive: true });
  }

  /* ==========================================================================
     C. ALTIN IŞIK TOZU (fairy dust)
     Parçacıklar yukarı doğru süzülür, imleçten hafifçe kaçar. Sayı ekran
     alanına göre ölçeklenir - telefonda 40, geniş masaüstünde ~110.
     ========================================================================= */
  const canvas = document.getElementById('dust');
  const ctx = canvas.getContext('2d', { alpha: true });
  let W = 0, H = 0, dots = [];

  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const n = Math.round(Math.min(110, Math.max(36, (W * H) / 16000)));
    dots = Array.from({ length: n }, () => spawn(true));
  }
  const rnd = (a, b) => a + Math.random() * (b - a);
  function spawn(anywhere){
    return {
      x: rnd(0, W), y: anywhere ? rnd(0, H) : rnd(H, H + 60),
      r: rnd(.6, 2.4), a: rnd(.15, .8),
      vy: rnd(-.16, -.5), vx: rnd(-.12, .12),
      tw: rnd(0, Math.PI * 2), ts: rnd(.008, .03)
    };
  }

  let mx = -999, my = -999;
  addEventListener('pointermove', (e) => { mx = e.clientX; my = e.clientY; }, { passive: true });

  function draw(){
    ctx.clearRect(0, 0, W, H);
    for (const d of dots){
      d.x += d.vx; d.y += d.vy; d.tw += d.ts;

      // imleçten kaçış: yakındaki zerreler yumuşakça itilir
      const dx = d.x - mx, dy = d.y - my, dist = Math.hypot(dx, dy);
      if (dist < 120){
        const f = (1 - dist / 120) * .9;
        d.x += (dx / (dist || 1)) * f; d.y += (dy / (dist || 1)) * f;
      }
      if (d.y < -20 || d.x < -30 || d.x > W + 30) Object.assign(d, spawn(false));

      const tw = .55 + .45 * Math.sin(d.tw);
      const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r * 5);
      g.addColorStop(0, `rgba(255,229,168,${d.a * tw})`);
      g.addColorStop(.4, `rgba(246,213,154,${d.a * tw * .38})`);
      g.addColorStop(1, 'rgba(246,213,154,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 5, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ==========================================================================
     D. TEK rAF DÖNGÜSÜ
     Parallax ve parçacıklar ayrı döngülerde koşsaydı iki kez layout/paint
     tetiklenirdi. Tek döngü = tek kare bütçesi.
     ========================================================================= */
  function tick(){
    for (const l of layers){
      l.x += (tx * l.depth * 100 - l.x) * .08;
      l.y += (ty * l.depth * 100 - l.y) * .08;
      l.el.style.transform = `translate3d(${l.x}px,${l.y}px,0)`;
    }
    draw();
    requestAnimationFrame(tick);
  }

  if (!reduced){
    resize();
    addEventListener('resize', resize);
    requestAnimationFrame(tick);
  }

  /* ==========================================================================
     E. GERİ SAYIM
     ========================================================================= */
  const TARGET = new Date('2026-09-12T18:00:00+03:00').getTime();
  const cells = {};
  document.querySelectorAll('#count b').forEach((b) => cells[b.dataset.k] = b);
  const pad = (v) => String(Math.max(0, v)).padStart(2, '0');

  setInterval(() => {
    const diff = Math.max(0, TARGET - Date.now());
    const next = {
      d: Math.floor(diff / 864e5),
      h: Math.floor(diff / 36e5) % 24,
      m: Math.floor(diff / 6e4) % 60,
      s: Math.floor(diff / 1e3) % 60
    };
    for (const k in cells){
      const v = pad(next[k]);
      if (cells[k].textContent !== v){
        cells[k].textContent = v;
        const tile = cells[k].parentElement;
        tile.classList.remove('pulse'); void tile.offsetWidth; tile.classList.add('pulse');
      }
    }
  }, 250);

  /* ==========================================================================
     F. MİKRO ETKİLEŞİMLER — mıknatıs hover + tıklama dalgası
     ========================================================================= */
  document.querySelectorAll('.btn').forEach((btn) => {
    if (!reduced){
      btn.addEventListener('pointermove', (e) => {
        const r = btn.getBoundingClientRect();
        const dx = (e.clientX - r.left - r.width / 2) / r.width;
        const dy = (e.clientY - r.top - r.height / 2) / r.height;
        btn.style.transform = `translate(${dx * 7}px,${dy * 5 - 2}px)`;
      });
      btn.addEventListener('pointerleave', () => btn.style.transform = '');
    }
    btn.addEventListener('click', (e) => {
      const r = btn.getBoundingClientRect();
      const el = document.createElement('span');
      el.className = 'ripple';
      const size = Math.max(r.width, r.height) * 2.2;
      el.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left}px;top:${e.clientY - r.top}px`;
      btn.appendChild(el);
      setTimeout(() => el.remove(), 700);
    });
  });

  /* ==========================================================================
     G. AÇILIŞ KOREOGRAFİSİ
     Kart ve metinler videonun ilk karesi boyandıktan SONRA girer; boş ekrana
     yazı düşmesi ucuz görünür, sahne kurulduktan sonra girmesi sinematiktir.
     ========================================================================= */
  const start = () => {
    document.getElementById('card').classList.add('in');
    setTimeout(() => document.getElementById('cue').classList.add('in'), 400);
  };
  video.addEventListener('canplay', start, { once: true });
  setTimeout(start, 1400);   // video gelmezse yine de gir (graceful degradation)
})();
</script>
</body>
</html>
